services:
  db:
    image: mysql:8.4
    container_name: webflix-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-webflixdb}
      MYSQL_USER: ${MYSQL_USER:-webflix}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-webflix}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    ports:
      - "3306:3306"
    volumes:
      - db-data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  api:
    build: .
    container_name: webflix-api
    restart: unless-stopped
    environment:
      DB_URL: jdbc:mysql://db:3306/${MYSQL_DATABASE:-webflixdb}?allowPublicKeyRetrieval=true&useSSL=false
      DB_USERNAME: ${MYSQL_USER:-webflix}
      DB_PASSWORD: ${MYSQL_PASSWORD:-webflix}
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy

  files:
    image: nginx:1.30-alpine
    container_name: webflix-files
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./archives:/usr/share/nginx/archives:ro

volumes:
  db-data:
