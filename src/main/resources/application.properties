spring.application.name=webflix-api
server.port=${PORT:5000}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/webflixdb?allowPublicKeyRetrieval=true&useSSL=false}
spring.datasource.username=${DB_USERNAME:webflix}
spring.datasource.password=${DB_PASSWORD:webflix}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

springdoc.swagger-ui.path=/swagger
